<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Relatórios de Custos - Mev Glass OS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-subtle: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --primary: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
        }

        .produto-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .produto-header {
            padding: 20px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .produto-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .produto-header .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .produto-body {
            padding: 25px;
            display: none;
        }

        .produto-body.active {
            display: block;
        }

        .variante-item {
            background: #f8fafc;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .variante-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sku-badge {
            background: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: monospace;
        }

        .insumos-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .insumos-table th {
            background: #e0f2fe;
            padding: 10px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0c4a6e;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .insumos-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.9rem;
        }

        .custos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--border-subtle);
        }

        .custo-item {
            text-align: center;
        }

        .custo-item label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .custo-item .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }

        .custo-item.success .value {
            color: var(--success);
        }

        .custo-item.warning .value {
            color: var(--warning);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="{{ url_for('inicio_page') }}">prodmanager</a></h1>
        <nav>
            <a href="{{ url_for('produtos_page') }}">Produtos</a>
            <a href="{{ url_for('clientes_page') }}">Clientes</a>
            <a href="{{ url_for('estoque_page') }}">Estoque</a>
            <a href="{{ url_for('faturamento_page') }}">Faturamento</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>📊 Relatório de Custos</h2>
            <span class="subtitle">Análise detalhada de insumos, custos de produção e margens de lucro</span>

            <div class="stats-grid" id="stats-container">
                <!-- Estatísticas serão carregadas aqui -->
            </div>

            <div id="loading" class="loading">
                Carregando relatório...
            </div>

            <div id="error" class="error" style="display:none;">
                Erro ao carregar relatório. Tente novamente.
            </div>

            <div id="relatorio-container">
                <!-- Produtos serão carregados aqui -->
            </div>
        </section>
    </main>

    <script>
        async function carregarRelatorio() {
            try {
                const response = await fetch('/relatorio/custos');
                const data = await response.json();

                if (data.status === 'ok') {
                    renderizarEstatisticas(data);
                    renderizarProdutos(data.relatorio);
                    document.getElementById('loading').style.display = 'none';
                } else {
                    mostrarErro();
                }
            } catch (error) {
                mostrarErro();
            }
        }

        function renderizarEstatisticas(data) {
            const container = document.getElementById('stats-container');

            let totalVariantes = 0;
            let valorTotalEstoque = 0;
            let margemMediaTotal = 0;
            let countMargens = 0;

            data.relatorio.forEach(produto => {
                totalVariantes += produto.total_variantes;
                produto.variantes.forEach(v => {
                    valorTotalEstoque += v.estoque.valor_total;
                    if (v.analise_custos.percentual_margem > 0) {
                        margemMediaTotal += v.analise_custos.percentual_margem;
                        countMargens++;
                    }
                });
            });

            const margemMedia = countMargens > 0 ? (margemMediaTotal / countMargens).toFixed(1) : 0;

            container.innerHTML = `
    <div class="stat-card">
      <h3>Total de Produtos</h3>
      <p class="stat-value">${data.total_produtos}</p>
    </div>
    <div class="stat-card">
      <h3>Total de Variantes</h3>
      <p class="stat-value">${totalVariantes}</p>
    </div>
    <div class="stat-card">
      <h3>Valor Total em Estoque</h3>
      <p class="stat-value">R$ ${valorTotalEstoque.toFixed(2)}</p>
    </div>
    <div class="stat-card">
      <h3>Margem Média</h3>
      <p class="stat-value">${margemMedia}%</p>
    </div>
  `;
        }

        function renderizarProdutos(produtos) {
            const container = document.getElementById('relatorio-container');
            container.innerHTML = '';

            produtos.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'produto-card';

                card.innerHTML = `
      <div class="produto-header" onclick="toggleProduto(${produto.produto_id})">
        <h3>${produto.linha} - ${produto.formato}</h3>
        <span class="badge">${produto.total_variantes} variante(s)</span>
      </div>
      <div class="produto-body" id="produto-${produto.produto_id}">
        ${produto.variantes.map(v => renderizarVariante(v)).join('')}
      </div>
    `;

                container.appendChild(card);
            });
        }

        function renderizarVariante(variante) {
            return `
    <div class="variante-item">
      <div class="variante-header">
        <div>
          <span class="sku-badge">${variante.sku}</span>
          <p style="margin: 5px 0 0 0; color: var(--text-muted); font-size: 0.9rem;">
            ${variante.dimensoes} • ${variante.cor} • ${variante.moldura}
          </p>
        </div>
      </div>

      <h4 style="margin: 15px 0 10px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase;">
        Insumos Utilizados
      </h4>
      <table class="insumos-table">
        <thead>
          <tr>
            <th>Material</th>
            <th>Quantidade</th>
            <th>Custo Unit.</th>
            <th>Custo Total</th>
          </tr>
        </thead>
        <tbody>
          ${variante.insumos.map(i => `
            <tr>
              <td>${i.material}</td>
              <td>${i.quantidade} ${i.unidade}</td>
              <td>R$ ${i.custo_unitario.toFixed(2)}</td>
              <td>R$ ${i.custo_total.toFixed(2)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>

      <div class="custos-grid">
        <div class="custo-item">
          <label>Custo Insumos</label>
          <div class="value">R$ ${variante.analise_custos.custo_insumos.toFixed(2)}</div>
        </div>
        <div class="custo-item">
          <label>Margem Interna (10%)</label>
          <div class="value">R$ ${variante.analise_custos.margem_interna_10pct.toFixed(2)}</div>
        </div>
        <div class="custo-item warning">
          <label>Custo de Produção</label>
          <div class="value">R$ ${variante.analise_custos.custo_producao_total.toFixed(2)}</div>
        </div>
        <div class="custo-item">
          <label>Preço Sugerido (125%)</label>
          <div class="value">R$ ${variante.analise_custos.preco_sugerido_125pct.toFixed(2)}</div>
        </div>
        <div class="custo-item success">
          <label>Preço de Venda</label>
          <div class="value">R$ ${variante.analise_custos.preco_venda_atual.toFixed(2)}</div>
        </div>
        <div class="custo-item success">
          <label>Margem de Lucro</label>
          <div class="value">${variante.analise_custos.percentual_margem.toFixed(1)}%</div>
        </div>
      </div>

      <div style="margin-top: 15px; padding: 12px; background: #f0f9ff; border-radius: 6px; font-size: 0.9rem;">
        <strong>Estoque:</strong> ${variante.estoque.quantidade} unidades • 
        <strong>Valor:</strong> R$ ${variante.estoque.valor_total.toFixed(2)}
      </div>
    </div>
  `;
        }

        function toggleProduto(id) {
            const body = document.getElementById(`produto-${id}`);
            body.classList.toggle('active');
        }

        function mostrarErro() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // Carregar ao iniciar
        document.addEventListener('DOMContentLoaded', carregarRelatorio);
    </script>

</body>

</html>
