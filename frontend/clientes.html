<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Clientes - Mev Glass OS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-subtle: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
            --primary: #0f172a;
            --blue-btn: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            display: block;
        }

        .form-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
            margin-bottom: 30px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            font-size: 1rem;
            color: var(--primary);
            margin: 0 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-subtle);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input,
        select {
            padding: 12px 16px;
            background-color: var(--bg-body);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            background-color: #fff;
            border-color: var(--blue-btn);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button[type="submit"] {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            margin-top: 20px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #1e293b;
            transform: translateY(-1px);
        }

        .clientes-list {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
        }

        .cliente-item {
            background: var(--bg-body);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cliente-info h4 {
            margin: 0 0 5px 0;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .cliente-info p {
            margin: 3px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-delete {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="{{ url_for('inicio_page') }}">prodmanager</a></h1>
        <nav>
            <a href="{{ url_for('produtos_page') }}">Produtos</a>
            <a href="{{ url_for('clientes_page') }}">Clientes</a>
            <a href="{{ url_for('estoque_page') }}">Estoque</a>
            <a href="{{ url_for('faturamento_page') }}">Faturamento</a>
            <a href="{{ url_for('relatorios_page') }}">Relatórios</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>👤 Cadastro de Clientes</h2>
            <span class="subtitle">Registre clientes com endereço completo</span>

            <div id="alert-container"></div>

            <div class="form-card">
                <form id="cliente-form">
                    <div class="form-section">
                        <h3>Dados Pessoais</h3>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="nome">Nome Completo *</label>
                                <input type="text" id="nome" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">E-mail *</label>
                                <input type="email" id="email" placeholder="cliente@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone *</label>
                                <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cpf_cnpj">CPF/CNPJ</label>
                                <input type="text" id="cpf_cnpj" placeholder="000.000.000-00">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Endereço</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cep">CEP *</label>
                                <input type="text" id="cep" placeholder="00000-000" required maxlength="9">
                            </div>
                            <div class="form-group">
                                <label for="numero">Número *</label>
                                <input type="text" id="numero" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label for="rua">Rua *</label>
                                <input type="text" id="rua" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="bairro">Bairro *</label>
                                <input type="text" id="bairro" required>
                            </div>
                            <div class="form-group">
                                <label for="complemento">Complemento</label>
                                <input type="text" id="complemento" placeholder="Apto, Bloco, etc.">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cidade">Cidade *</label>
                                <input type="text" id="cidade" required>
                            </div>
                            <div class="form-group">
                                <label for="estado">Estado *</label>
                                <select id="estado" required>
                                    <option value="">Selecione...</option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="submit">Cadastrar Cliente</button>
                </form>
            </div>

            <div class="clientes-list">
                <h3 style="margin-top: 0;">Clientes Cadastrados</h3>
                <div id="clientes-container" class="loading">
                    Carregando clientes...
                </div>
            </div>
        </section>
    </main>

    <script>
        // Buscar CEP automaticamente
        document.getElementById('cep').addEventListener('blur', async function () {
            const cep = this.value.replace(/\D/g, '');
            if (cep.length === 8) {
                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();

                    if (!data.erro) {
                        document.getElementById('rua').value = data.logradouro || '';
                        document.getElementById('bairro').value = data.bairro || '';
                        document.getElementById('cidade').value = data.localidade || '';
                        document.getElementById('estado').value = data.uf || '';
                    }
                } catch (error) {
                    console.error('Erro ao buscar CEP:', error);
                }
            }
        });

        // Máscara de CEP
        document.getElementById('cep').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 5) {
                value = value.substring(0, 5) + '-' + value.substring(5, 8);
            }
            e.target.value = value;
        });

        // Carregar clientes
        async function carregarClientes() {
            try {
                const response = await fetch('/clientes/listar');
                const clientes = await response.json();

                const container = document.getElementById('clientes-container');

                if (clientes.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhum cliente cadastrado ainda.</p>';
                    return;
                }

                container.innerHTML = clientes.map(c => `
            <div class="cliente-item">
                <div class="cliente-info">
                    <h4>${c.nome}</h4>
                    <p>📧 ${c.email} | 📞 ${c.telefone}</p>
                    <p>📍 ${c.endereco.rua}, ${c.endereco.numero} - ${c.endereco.bairro}, ${c.endereco.cidade}/${c.endereco.estado}</p>
                </div>
                <button class="btn-delete" onclick="deletarCliente(${c.id})">Excluir</button>
            </div>
        `).join('');
            } catch (error) {
                document.getElementById('clientes-container').innerHTML =
                    '<p style="color: var(--danger);">Erro ao carregar clientes</p>';
            }
        }

        // Cadastrar cliente
        document.getElementById('cliente-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                email: document.getElementById('email').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                cpf_cnpj: document.getElementById('cpf_cnpj').value.trim(),
                endereco: {
                    cep: document.getElementById('cep').value.trim(),
                    rua: document.getElementById('rua').value.trim(),
                    numero: document.getElementById('numero').value.trim(),
                    complemento: document.getElementById('complemento').value.trim(),
                    bairro: document.getElementById('bairro').value.trim(),
                    cidade: document.getElementById('cidade').value.trim(),
                    estado: document.getElementById('estado').value
                }
            };

            try {
                const response = await fetch('/cliente/criar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarAlerta('Cliente cadastrado com sucesso!', 'success');
                    e.target.reset();
                    carregarClientes();
                } else {
                    mostrarAlerta(data.error || 'Erro ao cadastrar cliente', 'error');
                }
            } catch (error) {
                mostrarAlerta('Erro de conexão', 'error');
            }
        });

        // Deletar cliente
        async function deletarCliente(id) {
            if (!confirm('Deseja realmente excluir este cliente?')) return;

            try {
                const response = await fetch(`/cliente/${id}`, { method: 'DELETE' });
                const data = await response.json();

                if (response.ok) {
                    mostrarAlerta('Cliente excluído com sucesso', 'success');
                    carregarClientes();
                } else {
                    mostrarAlerta(data.error || 'Erro ao excluir cliente', 'error');
                }
            } catch (error) {
                mostrarAlerta('Erro de conexão', 'error');
            }
        }

        // Mostrar alertas
        function mostrarAlerta(mensagem, tipo) {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${tipo}`;
            alert.textContent = mensagem;
            container.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        // Carregar ao iniciar
        document.addEventListener('DOMContentLoaded', carregarClientes);
    </script>

</body>

</html>
